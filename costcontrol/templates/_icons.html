{%- elif name=='presupuestos' -%}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/>
{%- elif name=='salir' -%}<path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
{%- elif name=='menu' -%}<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>

{%- elif name=='clock' -%}<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>
{%- elif name=='check' -%}<circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.8 2.8L16 9"/>
{%- elif name=='alert' -%}<path d="M12 3.5 21 19H3z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="16.6" r="0.7" fill="currentColor"/>
{%- elif name=='plus' -%}<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
{%- elif name=='trend' -%}<path d="M7 17 17 7"/><path d="M8.5 7H17v8.5"/>
{%- elif name=='ajustes' -%}<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
