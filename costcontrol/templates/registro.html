<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · CostControl</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='26' fill='%23101211'/><path d='M 97.7 33.6 A 46 46 0 1 0 97.7 86.4' fill='none' stroke='white' stroke-width='13' stroke-linecap='round'/><path d='M 79.1 40.9 A 27 27 0 1 0 79.1 79.1' fill='none' stroke='%238fdc1f' stroke-width='13' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { background:#0b0c0b; display:grid; place-items:center; min-height:100vh; }
    .login-wrap { text-align:center; padding:24px; width:100%; max-width:420px; }
    .login-mark { width:104px; height:104px; margin:0 auto 4px; display:block; }
    .login-name { font-size:30px; font-weight:800; letter-spacing:2px; color:#fff; }
    .login-name .g { color:var(--lime); }
    .login-tag { color:#8b948b; letter-spacing:1px; font-size:13px; margin:8px 0 22px; }
    form.login { background:#151715; border:1px solid #262a26; border-radius:14px; padding:22px; text-align:left; }
    form.login label { color:#9aa39a; }
    form.login input { background:#0e100e; border-color:#2b302b; color:#fff; }
    form.login input:focus { outline-color:var(--lime); border-color:var(--lime); }
    .login-btn { width:100%; margin-top:16px; background:var(--lime); color:#101211;
      border:none; padding:11px; border-radius:9px; font-weight:700; font-size:15px; cursor:pointer; }
    .login-btn:hover { background:var(--lime-dark); }
    .login-err { background:#2a1414; border:1px solid #5a2020; color:#ff8f8a;
      border-radius:8px; padding:9px; font-size:13.5px; margin-bottom:14px; }
    .login-foot { color:#6a726a; font-size:12.5px; margin-top:18px; }
    .fld { margin-top:12px; }
    .fld:first-child { margin-top:0; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <svg class="login-mark" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M 97.7 33.6 A 46 46 0 1 0 97.7 86.4" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
      <path d="M 79.1 40.9 A 27 27 0 1 0 79.1 79.1" fill="none" stroke="#8fdc1f" stroke-width="13" stroke-linecap="round"/>
    </svg>
    <div class="login-name">COST<span class="g">CONTROL</span></div>
    <div class="login-tag">Crea la cuenta de tu empresa</div>
    <form class="login" method="post">
      {% if error %}<div class="login-err">{{ error }}</div>{% endif %}
      <div class="fld"><label>Empresa</label>
        <input name="empresa" required placeholder="Mi Empresa S.L." value="{{ request.form.empresa or '' }}"></div>
      <div class="fld"><label>Tu nombre</label>
        <input name="nombre" placeholder="Nombre y apellidos" value="{{ request.form.nombre or '' }}"></div>
      <div class="fld"><label>Email</label>
        <input type="email" name="email" required placeholder="tu@empresa.com" value="{{ request.form.email or '' }}" autocomplete="username"></div>
      <div class="fld"><label>Contraseña</label>
        <input type="password" name="password" required placeholder="mínimo 6 caracteres" autocomplete="new-password"></div>
      <button class="login-btn" type="submit">Crear empresa y entrar</button>
    </form>
    <div class="login-foot">¿Ya tienes cuenta?
      <a href="{{ url_for('login') }}" style="color:var(--lime); font-weight:600">Inicia sesión</a>
    </div>
  </div>
</body>
</html>
